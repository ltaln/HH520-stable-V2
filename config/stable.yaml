project:
  name: HH520 Stable V3.4
  version: "3.4"

source:
  page: "10027s"
  base_url: "https://www.hh520.com/tx/10027s.php"
  date_params: ["riqi_start", "riqi_end"]
  threshold: 1
  bankroll: 5000
  formal_source_only: true

firecrawl:
  endpoint: "https://api.firecrawl.dev/v2/scrape"
  formats: ["markdown"]
  only_main_content: true
  proxy: "basic"
  store_in_cache: true
  max_age_ms: 0
  one_request_per_date: true

goal_timing:
  enabled_in_actions: false
  formal_chain: false
  research_compatibility_only: true
  failure_blocks_prediction: false

prediction:
  model_artifact: "model_artifacts/HH520_Stable_V3_4.json"
  wdl_model: "DRAW_ANCHOR_PLUS_MARKET_SIDE_SHARE"
  market_devig: true
  draw_anchor:
    market_weight: 0.789
    center_weight: 0.211
    center: 0.2574
  side_layer: "MARKET_HOME_SHARE"
  page_probability_for_direction: false
  page_probability_for_state: false
  market_failure_detector: "V1"
  risk_tiers: ["CONFIRM", "BALANCED", "TAIL_ALERT", "PASS"]
  automatic_market_override: false
  automatic_draw_override: false
  htft_model: "FT_CONDITIONAL_TEMPLATE_V1"
  htft_preserve_ft_marginal: true
  score_model: "HTFT_SCORE_TEMPLATE_V1"
  pooled_poisson_formal: false
  use_probability_layer: true
  use_value_layer: true
  use_decision_filter: true
  use_consistency_layer: true
  use_calibration_diagnostics: true
  decision_filter_version: "3.4"
  decision_filter_mode: "market_failure_detector_v1"
  allow_pass: true
  gpt_role: "EXPLANATION_ONLY"

output:
  version: "HH520-OUTPUT-V3.4"
  columns:
    - 球队对阵
    - 胜平负场景
    - 市场概率
    - 比分×2及概率
    - 半全场×2及概率
    - 总进球及概率
  semantics:
    market_probability: "官方赔率去水概率"
    model_probability: "Draw Anchor + Side Layer 后概率"
    risk_tier: "市场可靠度，不是概率"
    htft_probability: "条件联合概率"
    score_probability: "HTFT 条件模板概率"
  hidden_from_formal_table:
    - 通用模糊自信度
    - 最终筛选

research:
  enabled: true
  auto_tune_stable: false
  v34_development_window: "2026-09-10..2026-09-20"
  forward_validation_required: true
  candidate_changes_never_auto_promote: true
