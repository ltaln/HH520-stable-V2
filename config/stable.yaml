project:
  name: HH520 Stable V3.3
  version: "3.3"

source:
  page: "10027s"
  base_url: "https://www.hh520.com/tx/10027s.php"
  date_params: ["riqi_start", "riqi_end"]
  threshold: 1
  bankroll: 5000

firecrawl:
  endpoint: "https://api.firecrawl.dev/v2/scrape"
  formats: ["markdown"]
  only_main_content: true
  proxy: "basic"
  store_in_cache: true
  max_age_ms: 0
  one_request_per_date: true

goal_timing:
  enabled_in_actions: true
  best_effort: true
  candidate_only: true
  cache: true
  max_matches: 30
  bins: ["0-15", "16-30", "31-45", "46-60", "61-75", "76-90"]
  source_priority: ["soccerstats.com", "footystats.org", "inplaywise.com", "sofascore.com", "365scores.com"]
  allow_half_aggregate_fallback: true
  failure_blocks_prediction: false

prediction:
  model_artifact: "model_artifacts/HH520_Stable_V3_3.json"
  wdl_model: "MARKET_PROPORTIONAL_DEVIG"
  page_probability_for_direction: false
  page_probability_for_state: true
  state_engine: "V3_3_STATE_ENGINE"
  market_conflict_layer: true
  tail_alert_layer: true
  automatic_market_override: false
  automatic_draw_override: false
  htft_model: "CONDITIONAL_HT_GIVEN_FT+OPTIONAL_TIMING_REWEIGHT"
  htft_preserve_ft_marginal: true
  score_model: "POOLED_POISSON"
  high_variance_score_challenger_promoted: false
  use_probability_layer: true
  use_value_layer: true
  use_decision_filter: true
  use_consistency_layer: true
  use_calibration_diagnostics: true
  decision_filter_version: "3.3"
  decision_filter_mode: "state_engine_v3_3"
  allow_pass: true
  gpt_role: "EXPLANATION_ONLY"

output:
  version: "HH520-OUTPUT-V3.3"
  columns:
    - 球队对阵
    - 胜平负场景
    - 市场概率
    - 比分×2及概率
    - 半全场×2及概率
    - 总进球及概率
  hidden_from_formal_table:
    - 置信等级
    - 置信度
    - 最终筛选

research:
  enabled: true
  auto_tune_stable: false
  frozen_through: "2026-09-20"
  post_freeze_shadow_start: "2026-09-21"
