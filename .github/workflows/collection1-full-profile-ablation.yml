name: Collection 1 Full Profile Exhaustive Ablation

on:
  push:
    branches: [main]
    paths:
      - "collection1-ablation-requests/*.json"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore HH520 historical cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: collection1-ablation-hh520-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Fetch Collection 1 profile dataset
        run: |
          git fetch origin collection1-results:refs/remotes/origin/collection1-results
          git show origin/collection1-results:results/full-profile-sep1-20.json > _collection1_profiles.json
      - name: Run exhaustive ablation
        env:
          HH520_COLLECTION1_ABLATION_OFFLINE_ONLY: "1"
        run: python scripts/collection1_full_profile_ablation.py
      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin collection1-ablation-results || true
          if git show-ref --verify --quiet refs/remotes/origin/collection1-ablation-results; then
            git switch --detach origin/collection1-ablation-results
          else
            git switch --orphan collection1-ablation-results
            git rm -rf . || true
          fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_collection1_full_ablation.json" results/latest.json
          git add results/latest.json
          git commit -m "research: Collection 1 exhaustive full-profile ablation" || true
          git push origin HEAD:collection1-ablation-results --force
