name: HH520 10027 Factor Audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-10027-factor-audit-once.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-factor-audit-${{ github.run_id }}
          restore-keys: |
            hh520-calibration-20260801-20260920-
            hh520-collection-v1-
      - run: |
          mkdir -p _factor_audit
          python -m research.field_coverage_10027 --json _factor_audit/field_coverage.json --md _factor_audit/field_coverage.md
      - uses: actions/upload-artifact@v4
        with:
          name: HH520-10027-Factor-Coverage
          path: _factor_audit/
          if-no-files-found: error
