name: Firecrawl Credit Balance

on:
  push:
    paths:
      - ".github/workflows/firecrawl-credit-balance.yml"

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Check balances
        env:
          PRIMARY: ${{ secrets.FIRECRAWL_API_KEY }}
          BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
        shell: bash
        run: |
          set -euo pipefail
          check() {
            label="$1"
            key="$2"
            if [ -z "$key" ]; then
              echo "$label=NOT_CONFIGURED"
              return
            fi
            body="$(curl -sS -H "Authorization: Bearer $key" https://api.firecrawl.dev/v2/team/credit-usage)"
            remain="$(printf '%s' "$body" | jq -r '.data.remainingCredits // .remainingCredits // "UNKNOWN"')"
            echo "$label=$remain"
          }
          check PRIMARY "$PRIMARY"
          check BACKUP "$BACKUP"
