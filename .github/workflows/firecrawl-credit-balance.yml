name: Firecrawl Credit Balance

on:
  push:
    paths:
      - ".github/workflows/firecrawl-credit-balance.yml"

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Check balances
        env:
          PRIMARY: ${{ secrets.FIRECRAWL_API_KEY }}
          BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
          BACKUP2: ${{ secrets.FIRECRAWL_API_KEY_BACKUP2 }}
        shell: bash
        run: |
          set -euo pipefail
          check() {
            label="$1"
            key="$2"
            if [ -z "$key" ]; then
              echo "$label=NOT_CONFIGURED"
              return
            fi
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w "%{http_code}" -H "Authorization: Bearer $key" https://api.firecrawl.dev/v2/team/credit-usage)"
            body="$(cat "$tmp")"
            rm -f "$tmp"
            remain="$(printf '%s' "$body" | jq -r '.data.remainingCredits // .remainingCredits // .data.remaining_credits // .remaining_credits // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")"
            echo "$label=$remain HTTP=$code"
            if [ "$remain" = "UNKNOWN" ]; then
              printf '%s' "$body" | jq -c '{success,code,message,error,top_level_keys:(keys)}' 2>/dev/null || true
            fi
          }
          check PRIMARY "$PRIMARY"
          check BACKUP "$BACKUP"
          check BACKUP2 "$BACKUP2"
