name: Collect FootyStats Sep1-20 Timing V2
on:
  push:
    branches: [main]
    paths: ["footystats-timing-v2-requests/*.json"]
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: footystats-timing-v2-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Collect timing V2
        env:
          FIRECRAWL_API_KEY_BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
        run: python scripts/collect_footystats_sep1_20_timing_v2.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-timing-results || true
          if git show-ref --verify --quiet refs/remotes/origin/goal-timing-results; then git switch --detach origin/goal-timing-results; else git switch --orphan goal-timing-results; git rm -rf . || true; fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_footystats_sep1_20_timing_v2.json" results/footystats-sep1-20-v2.json
          git add results/footystats-sep1-20-v2.json
          git commit -m "research: collect FootyStats Sep1-20 timing V2" || true
          git push origin HEAD:goal-timing-results --force
