name: HH520 Relationship Tournament V3.2 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-relationship-v3-2-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore collection cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-v32-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Run V3.2 relationship tournament
        run: |
          mkdir -p _action_out
          python -m research.relationship_tournament_v3_2 --json _action_out/v3_2.json --md _action_out/v3_2.md
      - name: Upload V3.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HH520-Relationship-Tournament-V3-2
          path: |
            _action_out/v3_2.json
            _action_out/v3_2.md
          if-no-files-found: error
