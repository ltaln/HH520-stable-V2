name: Firecrawl Timing Search Probe
on:
  push:
    branches: [main]
    paths: ["timing-search-probe-requests/*.json"]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env:
          FIRECRAWL_API_KEY_BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
        run: python scripts/firecrawl_timing_search_probe.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin timing-research-results || true
          git switch --detach origin/timing-research-results
          cp "$GITHUB_WORKSPACE/_fc_search_probe.json" results/fc-search-probe.json
          git add results/fc-search-probe.json
          git commit -m "research: timing search probe" || true
          git push origin HEAD:timing-research-results --force
