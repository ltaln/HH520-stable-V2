name: HTFT Weak-Type Compensation Research

on:
  push:
    branches: [main]
    paths:
      - "weak-htft-requests/*.json"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore historical collection cache only
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-weak-htft-offline-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Verify offline cache
        run: |
          echo "cache_hit=${{ steps.restore-cache.outputs.cache-hit }}"
          find cache -maxdepth 1 -type f | wc -l
      - name: Run weak-type HTFT compensation research
        env:
          HH520_WEAK_HTFT_OFFLINE_ONLY: "1"
        run: python scripts/htft_weak_compensation_research.py
      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin weak-htft-results || true
          if git show-ref --verify --quiet refs/remotes/origin/weak-htft-results; then
            git switch --detach origin/weak-htft-results
          else
            git switch --orphan weak-htft-results
            git rm -rf . || true
          fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_htft_weak_compensation.json" results/latest.json
          git add results/latest.json
          git commit -m "research: htft weak-type compensation" || true
          git push origin HEAD:weak-htft-results --force
