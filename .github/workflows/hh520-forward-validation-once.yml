name: HH520 Stable V3 Forward Validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-forward-validation-once.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-forward-validation-${{ github.run_id }}
          restore-keys: |
            hh520-calibration-20260801-20260920-
            hh520-collection-v1-
      - run: |
          mkdir -p _forward_out
          python -m research.calibration.forward_validation --json _forward_out/forward_validation.json --md _forward_out/forward_validation.md
      - uses: actions/upload-artifact@v4
        with:
          name: HH520-Stable-V3-Forward-Validation
          path: _forward_out/
          if-no-files-found: error
