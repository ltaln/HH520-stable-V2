name: HH520 Sep21 Count
on:
  push:
    branches: [main]
    paths:
      - "diagnostic-requests/sep21-count-*.json"
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Count Sep21
        env:
          FIRECRAWL_API_KEY_BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
        run: python scripts/sep21_count.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostic-results || true
          git switch --detach origin/diagnostic-results
          cp "$GITHUB_WORKSPACE/_sep21_count.json" results/sep21-count.json
          git add results/sep21-count.json
          git commit -m "diagnostic: count Sep21 matches" || true
          git push origin HEAD:diagnostic-results --force
