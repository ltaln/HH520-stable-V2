name: Dongqiudi Live Smoke
on:
  push:
    paths:
      - ".github/workflows/dongqiudi-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY_BACKUP2 }}
      PYTHONUTF8: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect one real Dongqiudi match
        run: |
          set -euo pipefail
          mkdir -p _smoke
          PYTHONPATH=. python - <<'PY'
          import json
          from collector.dongqiudi_source import collect_match_analysis
          from engine.full_data_layer import data_mode
          dq=collect_match_analysis("2026-09-14","比利亚雷","贝蒂斯")
          match={"goal_timing":{"available":False},"dongqiudi_enrichment":dq}
          out={"dongqiudi":dq,"data_mode":data_mode(match)}
          open("_smoke/dongqiudi-live-smoke.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
              "available":dq.get("available"),
              "match_detail_id":dq.get("match_detail_id"),
              "groups":dq.get("groups"),
              "home_keys":sorted((dq.get("home") or {}).keys()),
              "away_keys":sorted((dq.get("away") or {}).keys()),
              "data_mode":out["data_mode"],
          },ensure_ascii=False,indent=2))
          if not dq.get("available"):
              raise SystemExit("Dongqiudi real-page collection unavailable")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dongqiudi-live-smoke
          path: _smoke/dongqiudi-live-smoke.json
