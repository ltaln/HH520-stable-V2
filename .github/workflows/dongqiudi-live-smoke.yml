name: Dongqiudi Live Smoke
on:
  push:
    paths:
      - ".github/workflows/dongqiudi-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY_BACKUP2 }}
      PYTHONUTF8: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect one real Dongqiudi match
        run: |
          set -euo pipefail
          mkdir -p _smoke
          PYTHONPATH=. python - <<'PY'
          import json
          import requests
          from collector.dongqiudi_source import collect_match_analysis, parse_analysis_markdown
          from collector.firecrawl_client import scrape_markdown
          from engine.full_data_layer import data_mode

          probes={}
          for name,url in {
              "index":"https://api.dongqiudi.com/data/index",
              "important":"https://api.dongqiudi.com/data/tab/important?start=2026-09-13T16:00:00&version=551&init=1",
              "pc_spread":"https://lottery-aggregator.dongqiudi.com/pcWeb/spreadMatch",
              "pc_overview":"https://pc.dongqiudi.com/api/data/overview/match/54493236",
              "pc_detail":"https://pc.dongqiudi.com/magicball/v1/match/app/detail?id=54493236&app=dqd&lang=zh-cn",
              "pc_lineup":"https://pc.dongqiudi.com/sport-data/soccer/biz/dqd/v1/match/lineup/4493236?app=dqd&lang=zh-cn",
          }.items():
              try:
                  r=requests.get(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.dongqiudi.com/"},timeout=20)
                  body=r.text[:8000] if name in {"pc_overview","pc_detail","pc_lineup","pc_spread"} else r.text[:1200]
                  probes[name]={"status":r.status_code,"content_type":r.headers.get("content-type"),"body":body}
              except Exception as exc:
                  probes[name]={"error":type(exc).__name__}

          known_url="https://m.dongqiudi.com/matchDetail/54493236/analysis"
          raw=scrape_markdown(known_url)
          markdown=((raw.get("data") or {}).get("markdown") if isinstance(raw,dict) else None) or ""
          direct=parse_analysis_markdown(markdown,"比利亚雷","贝蒂斯")
          dq=collect_match_analysis("2026-09-14","比利亚雷","贝蒂斯")
          match={"goal_timing":{"available":False},"dongqiudi_enrichment":{
              "available":any(direct.get("groups",{}).values()),
              **direct,
          }}
          out={"probes":probes,"direct_known_id":direct,"discovery":dq,"data_mode":data_mode(match)}
          open("_smoke/dongqiudi-live-smoke.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
              "schedule_probes":probes,
              "discovery_available":dq.get("available"),
              "discovery_match_detail_id":dq.get("match_detail_id"),
              "direct_groups":direct.get("groups"),
              "direct_home_keys":sorted((direct.get("home") or {}).keys()),
              "direct_away_keys":sorted((direct.get("away") or {}).keys()),
              "data_mode":out["data_mode"],
          },ensure_ascii=False,indent=2))
          if not any(direct.get("groups",{}).values()):
              raise SystemExit("Dongqiudi direct real-page parsing unavailable")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dongqiudi-live-smoke
          path: _smoke/dongqiudi-live-smoke.json
