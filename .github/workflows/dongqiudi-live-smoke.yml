name: Dongqiudi Integration Smoke
on:
  push:
    paths:
      - ".github/workflows/dongqiudi-live-smoke.yml"
      - "collector/dongqiudi_source.py"
      - "collector/dongqiudi_technical.py"
      - "collector/dongqiudi_runtime.py"
      - "engine/full_data_layer.py"
      - "tests/test_dongqiudi_technical.py"
      - "tests/test_dongqiudi_live_review_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY_BACKUP2 }}
      PYTHONUTF8: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect one real Dongqiudi prematch fixture
        run: |
          set -euo pipefail
          mkdir -p _smoke
          PYTHONPATH=. python - <<'PY'
          import json
          import requests
          from collector.dongqiudi_source import collect_match_analysis, parse_analysis_markdown
          from collector.dongqiudi_technical import collect_prematch_technical_history
          from collector.firecrawl_client import scrape_markdown
          from engine.full_data_layer import data_mode

          probes={}
          for name,url in {
              "index":"https://api.dongqiudi.com/data/index",
              "important":"https://api.dongqiudi.com/data/tab/important?start=2026-09-13T16:00:00&version=551&init=1",
              "pc_spread":"https://lottery-aggregator.dongqiudi.com/pcWeb/spreadMatch",
              "pc_overview":"https://pc.dongqiudi.com/api/data/overview/match/54493236",
              "pc_detail":"https://pc.dongqiudi.com/magicball/v1/match/app/detail?id=54493236&app=dqd&lang=zh-cn",
              "pc_lineup":"https://pc.dongqiudi.com/sport-data/soccer/biz/dqd/v1/match/lineup/4493236?app=dqd&lang=zh-cn",
          }.items():
              try:
                  r=requests.get(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.dongqiudi.com/"},timeout=20)
                  body=r.text[:8000] if name in {"pc_overview","pc_detail","pc_lineup","pc_spread"} else r.text[:1200]
                  probes[name]={"status":r.status_code,"content_type":r.headers.get("content-type"),"body":body}
              except Exception as exc:
                  probes[name]={"error":type(exc).__name__}

          known_url="https://m.dongqiudi.com/matchDetail/54493236/analysis"
          raw=scrape_markdown(known_url)
          markdown=((raw.get("data") or {}).get("markdown") if isinstance(raw,dict) else None) or ""
          direct=parse_analysis_markdown(markdown,"比利亚雷","贝蒂斯")
          lineup_debug=requests.get(
              "https://pc.dongqiudi.com/sport-data/soccer/biz/dqd/v1/match/lineup/4493236?app=dqd&lang=zh-cn",
              headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.dongqiudi.com/"},
              timeout=20,
          ).json()
          print("LINEUP_TOP_KEYS", sorted(lineup_debug.keys()))
          print("RECENT_MATCH_PERSONS", json.dumps(lineup_debug.get("recent_match_persons"),ensure_ascii=False)[:12000])
          dq=collect_match_analysis("2026-09-14","比利亚雷","贝蒂斯")
          history=collect_prematch_technical_history(
              "54493236","比利亚雷亚尔","皇家贝蒂斯","2026-09-14T19:00:00+00:00"
          )
          live=collect_match_analysis(
              "2026-10-19","里昂","尼斯",league="法甲",kickoff="2026-10-19T02:45:00+08:00"
          )
          direct_match={"goal_timing":{"available":False},"dongqiudi_enrichment":{
              "available":any(direct.get("groups",{}).values()),
              **direct,
          }}
          live_match={"goal_timing":{"available":False},"dongqiudi_enrichment":live}
          out={
              "probes":probes,"direct_known_id":direct,"discovery":dq,
              "history":history,"live_formal_path":live,
              "direct_data_mode":data_mode(direct_match),
              "live_data_mode":data_mode(live_match),
          }
          open("_smoke/dongqiudi-live-smoke.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({
              "schedule_probes":probes,
              "discovery_available":dq.get("available"),
              "discovery_match_detail_id":dq.get("match_detail_id"),
              "direct_groups":direct.get("groups"),
              "history_home_samples":(history.get("home") or {}).get("sample_count"),
              "history_away_samples":(history.get("away") or {}).get("sample_count"),
              "history_home_metric_keys":sorted(((history.get("home") or {}).get("metrics") or {}).keys()),
              "history_away_metric_keys":sorted(((history.get("away") or {}).get("metrics") or {}).keys()),
              "live_available":live.get("available"),
              "live_match_detail_id":live.get("match_detail_id"),
              "live_source":live.get("source"),
              "live_groups":live.get("groups"),
              "live_home_keys":sorted((live.get("home") or {}).keys()),
              "live_away_keys":sorted((live.get("away") or {}).keys()),
              "live_technical_history":live.get("technical_history"),
              "direct_home_keys":sorted((direct.get("home") or {}).keys()),
              "direct_away_keys":sorted((direct.get("away") or {}).keys()),
              "direct_data_mode":out["direct_data_mode"],
              "live_data_mode":out["live_data_mode"],
          },ensure_ascii=False,indent=2))
          if not any(direct.get("groups",{}).values()):
              raise SystemExit("Dongqiudi direct real-page parsing unavailable")
          if (history.get("home") or {}).get("sample_count",0) < 1 or (history.get("away") or {}).get("sample_count",0) < 1:
              raise SystemExit("Dongqiudi prematch technical history unavailable")
                    required_direct_groups=("RECENT_FORM","VENUE_FORM","GF_GA","SHOTS","POSSESSION","DANGEROUS_ATTACKS","BIG_CHANCES","GOAL_TIMING")
          missing=[name for name in required_direct_groups if not (direct.get("groups") or {}).get(name)]
          if missing:
              raise SystemExit("Dongqiudi direct required groups unavailable: "+",".join(missing))
          if not (history.get("home") or {}).get("metrics",{}).get("expected_goals") or not (history.get("away") or {}).get("metrics",{}).get("expected_goals"):
              raise SystemExit("Dongqiudi historical xG unavailable")
          if not (history.get("home") or {}).get("metrics",{}).get("timing_bins") or not (history.get("away") or {}).get("metrics",{}).get("timing_bins"):
              raise SystemExit("Dongqiudi historical goal-timing unavailable")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dongqiudi-live-smoke
          path: _smoke/dongqiudi-live-smoke.json
