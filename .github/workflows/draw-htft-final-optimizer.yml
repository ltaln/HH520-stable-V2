name: Draw HTFT Final Offline Optimizer

on:
  push:
    branches: [main]
    paths:
      - "optimizer-requests/*.json"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch existing research archives only
        run: git fetch origin research-results:refs/remotes/origin/research-results
      - name: Restore historical collection cache only
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-offline-readonly-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Verify no collection path is used
        run: |
          echo "cache_hit=${{ steps.restore-cache.outputs.cache-hit }}"
          find cache -maxdepth 1 -type f | wc -l
      - name: Run draw and HTFT optimizer
        env:
          HH520_OPTIMIZER_OFFLINE_ONLY: "1"
        run: python scripts/draw_htft_final_optimizer.py
      - name: Publish optimizer result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin optimizer-results || true
          if git show-ref --verify --quiet refs/remotes/origin/optimizer-results; then
            git switch --detach origin/optimizer-results
          else
            git switch --orphan optimizer-results
            git rm -rf . || true
          fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_draw_htft_final.json" results/latest.json
          git add results/latest.json
          git commit -m "research: draw htft final optimizer" || true
          git push origin HEAD:optimizer-results --force