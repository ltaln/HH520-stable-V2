name: Collect Sep1-20 Goal Timing
on:
  push:
    branches: [main]
    paths: ["goal-timing-collection-requests/*.json"]
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: goal-timing-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - run: python scripts/collect_sep1_20_goal_timing.py
      - name: Publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-timing-results || true
          if git show-ref --verify --quiet refs/remotes/origin/goal-timing-results; then git switch --detach origin/goal-timing-results; else git switch --orphan goal-timing-results; git rm -rf . || true; fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_sep1_20_goal_timing.json" results/sep1-20.json
          git add results/sep1-20.json
          git commit -m "research: collect Sep1-20 goal timing" || true
          git push origin HEAD:goal-timing-results --force
