name: HH520 Research Lab V1
run-name: "research - ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      start_date:
        required: true
        type: string
      end_date:
        required: true
        type: string
permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate request id
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || exit 2
      - name: Publish PENDING immediately
        run: python scripts/publish_action_status.py research-results "$REQUEST_ID" PENDING research

  run:
    needs: status
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: hh520-collection-main
      cancel-in-progress: false
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      FIRECRAWL_API_KEY_BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
      FIRECRAWL_API_KEY_BACKUP2: ${{ secrets.FIRECRAWL_API_KEY_BACKUP2 }}
      PYTHONUTF8: "1"
      REQUEST_ID: ${{ inputs.request_id }}
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate request
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          test -n "$FIRECRAWL_API_KEY" || { echo "FIRECRAWL_API_KEY secret is missing"; exit 3; }
          python -c 'import os; from research.lab import date_range; date_range(os.environ["START_DATE"],os.environ["END_DATE"])'
      - name: Restore collection cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hh520-collection-v1-
      - name: Run research
        id: execute
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          mkdir -p _action_out
          python -m research.runner "$START_DATE" "$END_DATE" --output "_action_out/$REQUEST_ID.json" --calibration-md "_action_out/${REQUEST_ID}_calibration.md"
      - name: Preserve cache and request ledger even after failure
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hh520-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload calibration report artifact
        if: steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: "calibration-${{ inputs.request_id }}"
          path: "_action_out/${{ inputs.request_id }}_calibration.md"
          if-no-files-found: error
      - name: Publish READY result
        if: steps.execute.outcome == 'success'
        run: python scripts/publish_action_result.py "_action_out/$REQUEST_ID.json" "research-results" "$REQUEST_ID"
      - name: Publish FAILED state
        if: failure() && steps.execute.outcome != 'success'
        run: python scripts/publish_action_status.py research-results "$REQUEST_ID" FAILED research
