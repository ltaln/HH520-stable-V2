name: HH520 Hidden Formula V3 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-hidden-formula-v3-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore collection cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-v3-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Run V3 walk-forward
        run: |
          mkdir -p _action_out
          python -m research.hidden_formula_v3 --json _action_out/hidden_formula_v3.json --md _action_out/hidden_formula_v3.md
      - name: Upload V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HH520-Hidden-Formula-V3-WalkForward
          path: |
            _action_out/hidden_formula_v3.json
            _action_out/hidden_formula_v3.md
          if-no-files-found: error
