name: HH520 10027 Raw Header Inspect
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-10027-raw-header-inspect-once.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-raw-header-inspect-${{ github.run_id }}
          restore-keys: |
            hh520-calibration-20260801-20260920-
            hh520-collection-v1-
      - shell: bash
        run: |
          mkdir -p _inspect
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("cache/10027s_2026-08-01.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          md=obj["raw"]["data"]["markdown"]
          lines=md.splitlines()
          out=[]
          for i,line in enumerate(lines):
              if all(x in line for x in ["进攻","防守","交锋","状态"]):
                  out.append(f"HEADER_INDEX={i}")
                  for j in range(max(0,i-2), min(len(lines),i+8)):
                      out.append(f"{j}: {lines[j]}")
                  out.append("")
          Path("_inspect/raw_header_excerpt.txt").write_text("\n".join(out),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HH520-10027-Raw-Header-Inspect
          path: _inspect/
          if-no-files-found: error
