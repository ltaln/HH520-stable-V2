name: HTFT Split-Group Research

on:
  push:
    branches: [main]
    paths:
      - "split-htft-requests/*.json"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore existing historical cache only
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-split-htft-offline-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Verify offline cache
        run: find cache -maxdepth 1 -type f | wc -l
      - name: Run split-group HTFT research
        env:
          HH520_SPLIT_HTFT_OFFLINE_ONLY: "1"
        run: python scripts/htft_split_group_research.py
      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin split-htft-results || true
          if git show-ref --verify --quiet refs/remotes/origin/split-htft-results; then
            git switch --detach origin/split-htft-results
          else
            git switch --orphan split-htft-results
            git rm -rf . || true
          fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_htft_split_group_research.json" results/latest.json
          git add results/latest.json
          git commit -m "research: split HTFT weak-type groups" || true
          git push origin HEAD:split-htft-results --force
