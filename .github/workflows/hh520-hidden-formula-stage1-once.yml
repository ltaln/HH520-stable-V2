name: HH520 Hidden Formula Stage 1
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-hidden-formula-stage1-once.yml"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-hidden-formula-${{ github.run_id }}
          restore-keys: |
            hh520-calibration-20260801-20260920-
            hh520-collection-v1-
      - run: |
          mkdir -p _hidden_formula
          python -m research.hidden_formula_v1 --json _hidden_formula/hidden_formula_stage1.json --md _hidden_formula/hidden_formula_stage1.md
      - uses: actions/upload-artifact@v4
        with:
          name: HH520-Hidden-Formula-Stage1
          path: _hidden_formula/
          if-no-files-found: error
