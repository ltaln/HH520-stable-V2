name: HH520 Stable V3 Calibration 20260801-20260920
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-calibration-once.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: hh520-calibration-20260801-20260920
      cancel-in-progress: false
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
      FIRECRAWL_MIN_INTERVAL_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate secret
        run: test -n "$FIRECRAWL_API_KEY"
      - name: Restore historical collection cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-calibration-20260801-20260920-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Run long-window calibration
        run: |
          mkdir -p _calibration_out
          python -m research.calibration.window_runner 2026-08-01 2026-09-20             --output _calibration_out/HH520_Stable_V3_Calibration_20260801_20260920.json             --markdown _calibration_out/HH520_Stable_V3_Calibration_20260801_20260920.md
      - name: Save collection cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hh520-calibration-20260801-20260920-${{ github.run_id }}
      - name: Upload calibration outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HH520-Stable-V3-Calibration-20260801-20260920
          path: _calibration_out/
          if-no-files-found: error
