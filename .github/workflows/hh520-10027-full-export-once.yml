name: HH520 10027 Full Export
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-10027-full-export-once.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
      HH520_ALLOW_INCOMPLETE_REQUEST_RESUME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-full-export-${{ github.run_id }}
          restore-keys: |
            hh520-calibration-20260801-20260920-
            hh520-collection-v1-
      - run: |
          mkdir -p _export
          python -m research.export_10027_full --csv _export/10027s_20260801_20260920_full.csv --audit _export/10027s_20260801_20260920_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: HH520-10027-Full-Row-Level
          path: _export/
          if-no-files-found: error
