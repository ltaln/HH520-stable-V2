name: HH520 Build Candidate V3.2 Artifact Once\n\non:\n  push:\n    branches: ["upgrade/prediction-v3-2"]\n    paths:\n      - ".github/workflows/hh520-build-v3-2-artifact-once.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: upgrade/prediction-v3-2\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n          cache: pip\n      - run: python -m pip install -r requirements.txt\n      - name: Restore historical cache\n        uses: actions/cache/restore@v4\n        with:\n          path: cache\n          key: hh520-v32-artifact-${{ github.run_id }}\n          restore-keys: |\n            hh520-collection-v1-\n      - name: Build frozen artifact\n        run: |\n          mkdir -p _artifact\n          python -m research.build_candidate_v32_artifact --output _artifact/HH520_Candidate_V3_2.json\n      - uses: actions/upload-artifact@v4\n        with:\n          name: HH520-Candidate-V3-2-Runtime-Artifact\n          path: _artifact/HH520_Candidate_V3_2.json\n          if-no-files-found: error\n