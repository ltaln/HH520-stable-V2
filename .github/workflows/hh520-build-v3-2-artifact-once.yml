name: HH520 Build Candidate V3.2 Artifact Once

on:
  push:
    branches: ["upgrade/prediction-v3-2"]
    paths:
      - ".github/workflows/hh520-build-v3-2-artifact-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/prediction-v3-2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore historical cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-v32-artifact-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Build frozen artifact
        run: |
          mkdir -p _artifact
          python -m research.build_candidate_v32_artifact --output _artifact/HH520_Candidate_V3_2.json
      - uses: actions/upload-artifact@v4
        with:
          name: HH520-Candidate-V3-2-Runtime-Artifact
          path: _artifact/HH520_Candidate_V3_2.json
          if-no-files-found: error
