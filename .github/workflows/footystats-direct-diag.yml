name: FootyStats Direct Diagnostic
on:
  push:
    branches: [main]
    paths: ["footystats-direct-diag-requests/*.json"]
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python scripts/footystats_direct_diag.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin timing-research-results
          git switch --detach origin/timing-research-results
          cp "$GITHUB_WORKSPACE/_footystats_direct_diag.json" results/footystats-direct-diag.json
          git add results/footystats-direct-diag.json
          git commit -m "research: FootyStats direct diagnostic" || true
          git push origin HEAD:timing-research-results --force
