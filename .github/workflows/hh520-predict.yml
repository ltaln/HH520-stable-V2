name: HH520 Stable V3.5.1 Prediction
run-name: "stable-v3.5.1 - ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      command:
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate request id
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || exit 2
      - name: Publish PENDING immediately
        run: python scripts/publish_action_status.py action-results "$REQUEST_ID" PENDING stable

  run:
    needs: status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hh520-collection-main
      cancel-in-progress: false
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      FIRECRAWL_API_KEY_BACKUP: ${{ secrets.FIRECRAWL_API_KEY_BACKUP }}
      PYTHONUTF8: "1"
      REQUEST_ID: ${{ inputs.request_id }}
      HH520_GOAL_TIMING_ENABLED: "1"
      HH520_GOAL_TIMING_ONLY_UNCERTAIN: "0"
      HH520_GOAL_TIMING_MAX_MATCHES: "100"
      HH520_GOAL_TIMING_RETRY_FAILURES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate request
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          test -n "$FIRECRAWL_API_KEY" || { echo "FIRECRAWL_API_KEY secret is missing"; exit 3; }
          python -c 'import os; from controller.command_router import parse_command; parse_command(os.environ["COMMAND"])'
      - name: Restore collection cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hh520-collection-v1-
      - name: Run Stable V3.5.1
        id: execute
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          mkdir -p _action_out
          python main.py "$COMMAND" --output "_action_out/$REQUEST_ID.json"
      - name: Inspect generated output
        if: always()
        run: |
          set -euo pipefail
          echo "=== action output directory ==="
          ls -la _action_out || true
          if [ -f "_action_out/$REQUEST_ID.json" ]; then
            echo "=== result preview ==="
            python - <<'PY'
            import json, os
            p=f"_action_out/{os.environ['REQUEST_ID']}.json"
            data=json.load(open(p,encoding='utf-8'))
            print(json.dumps({
              'status': data.get('status'),
              'prediction_count': len(data.get('predictions') or []),
              'has_output_contract': bool(data.get('output_contract')),
              'display_rows': len(data.get('display_rows') or data.get('output_contract',{}).get('display_rows') or [])
            }, ensure_ascii=False, indent=2))
            PY
          else
            echo "missing action output"
          fi
      - name: Preserve cache and request ledger even after failure
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hh520-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish READY result
        if: steps.execute.outcome == 'success'
        run: python scripts/publish_action_result.py "_action_out/$REQUEST_ID.json" "action-results" "$REQUEST_ID"
      - name: Verify published prediction contract
        if: steps.execute.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin action-results
          git show origin/action-results:results/$REQUEST_ID.json > /tmp/hh520-result.json
          python - <<'PY'
          import json
          import os
          data=json.load(open('/tmp/hh520-result.json',encoding='utf-8'))
          assert data.get('status') == 'READY', data
          assert data.get('request_id') == os.environ['REQUEST_ID'], data
          rows=data.get('display_rows') or data.get('output_contract',{}).get('display_rows')
          assert isinstance(rows,list), data
          print('HH520 READY contract verified:', len(rows), 'rows')
          PY
      - name: Publish FAILED state with diagnostics
        if: failure()
        run: |
          python scripts/publish_action_status.py action-results "$REQUEST_ID" FAILED stable || true
