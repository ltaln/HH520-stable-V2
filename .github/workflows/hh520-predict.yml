name: HH520 Stable V3.2 Prediction
run-name: "stable-v3.2 - ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      command:
        required: true
        type: string
permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate request id
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || exit 2
      - name: Publish PENDING immediately
        run: python scripts/publish_action_status.py action-results "$REQUEST_ID" PENDING stable

  run:
    needs: status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hh520-collection-main
      cancel-in-progress: false
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate request
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          test -n "$FIRECRAWL_API_KEY" || { echo "FIRECRAWL_API_KEY secret is missing"; exit 3; }
          python -c 'import os; from controller.command_router import parse_command; parse_command(os.environ["COMMAND"])'
      - name: Restore collection cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hh520-collection-v1-
      - name: Run stable
        id: execute
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          mkdir -p _action_out
          python main.py "$COMMAND" --output "_action_out/$REQUEST_ID.json"
      - name: Preserve cache and request ledger even after failure
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hh520-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish READY result
        if: steps.execute.outcome == 'success'
        run: python scripts/publish_action_result.py "_action_out/$REQUEST_ID.json" "action-results" "$REQUEST_ID"
      - name: Publish FAILED state
        if: failure() && steps.execute.outcome != 'success'
        run: python scripts/publish_action_status.py action-results "$REQUEST_ID" FAILED stable
