name: HH520 GPT Prediction

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request id generated by GPT (letters, digits, dash, underscore only)"
        required: true
        type: string
      command:
        description: "Example: 预测 2026-09-20 全部比赛"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hh520-gpt-prediction
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout Stable V2
        uses: actions/checkout@v4

      - name: Validate request
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || { echo "invalid request_id"; exit 2; }
          [[ "$COMMAND" =~ ^预测[[:space:]][0-9]{4}-[0-9]{2}-[0-9]{2}([[:space:]]全部比赛)?$ ]] || { echo "invalid command"; exit 2; }
          test -n "$FIRECRAWL_API_KEY" || { echo "FIRECRAWL_API_KEY secret is missing"; exit 3; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare GPT handoff
        env:
          COMMAND: ${{ inputs.command }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p _action_out
          python main.py "$COMMAND" --output "_action_out/$REQUEST_ID.json"

      - name: Publish result to isolated branch
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          result_file="$GITHUB_WORKSPACE/_action_out/$REQUEST_ID.json"
          test -f "$result_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          workdir="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin action-results >/dev/null 2>&1; then
            git clone --depth 1 --branch action-results "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$workdir"
          else
            git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$workdir"
            cd "$workdir"
            git checkout --orphan action-results
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cd "$workdir"
          mkdir -p results
          cp "$result_file" "results/$REQUEST_ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("results") / (os.environ["REQUEST_ID"] + ".json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["_action"] = {
              "request_id": os.environ["REQUEST_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["GITHUB_SHA"],
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2, allow_nan=False), encoding="utf-8")
          PY
          git add "results/$REQUEST_ID.json"
          git commit -m "result: $REQUEST_ID"
          git push origin HEAD:action-results
