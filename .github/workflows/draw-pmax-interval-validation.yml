name: Draw Pmax Interval Validation

on:
  push:
    branches: [main]
    paths:
      - "draw-interval-requests/*.json"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore HH520 cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: draw-interval-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Run interval validation
        env:
          HH520_DRAW_INTERVAL_OFFLINE_ONLY: "1"
        run: python scripts/draw_pmax_interval_validation.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin draw-interval-results || true
          if git show-ref --verify --quiet refs/remotes/origin/draw-interval-results; then
            git switch --detach origin/draw-interval-results
          else
            git switch --orphan draw-interval-results
            git rm -rf . || true
          fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/_draw_pmax_interval.json" results/latest.json
          git add results/latest.json
          git commit -m "research: draw pmax interval validation" || true
          git push origin HEAD:draw-interval-results --force
