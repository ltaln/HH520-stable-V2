name: HH520 V3 Export Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hh520-v3-export-once.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore cumulative collection cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hh520-v3-export-${{ github.run_id }}
          restore-keys: |
            hh520-collection-v1-
      - name: Verify full cache window without network
        run: |
          python - <<'PY'
          import datetime as dt
          from collector.cache_manager import load_cache
          start=dt.date(2026,5,1)
          end=dt.date(2026,9,20)
          missing=[]
          d=start
          while d<=end:
              day=d.isoformat()
              if load_cache(day, source="10027s") is None:
                  missing.append(day)
              d += dt.timedelta(days=1)
          print("missing_cache_dates", len(missing))
          if missing:
              print("\n".join(missing))
              raise SystemExit(2)
          PY
      - name: Export corrected row-level master dataset
        run: |
          mkdir -p _v3_export
          python -m research.export_10027_full \
            --start 2026-05-01 \
            --end 2026-09-20 \
            --csv _v3_export/10027s_20260501_20260920_full.csv \
            --audit _v3_export/10027s_20260501_20260920_audit.json
      - name: Upload V3 master dataset
        uses: actions/upload-artifact@v4
        with:
          name: HH520-V3-Master-20260501-20260920
          path: _v3_export/
          if-no-files-found: error
