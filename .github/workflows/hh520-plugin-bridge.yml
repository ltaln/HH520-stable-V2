name: HH520 Plugin Bridge

on:
  push:
    branches: [main]
    paths:
      - "plugin-requests/**/*.json"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Locate request file
        id: request
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^plugin-requests/.*\.json$' | tail -n 1)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Validate and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          TYPE="$(jq -r '.type // empty' "$REQUEST_FILE")"
          REQUEST_ID="$(jq -r '.request_id // empty' "$REQUEST_FILE")"

          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || { echo "invalid request_id"; exit 2; }

          if [[ "$TYPE" == "prediction" ]]; then
            COMMAND="$(jq -r '.command // empty' "$REQUEST_FILE")"
            [[ "$COMMAND" =~ ^预测[[:space:]][0-9]{4}-[0-9]{2}-[0-9]{2}([[:space:]]全部比赛)?$ ]] || {
              echo "invalid prediction command"
              exit 2
            }
            PAYLOAD="$(jq -nc --arg ref main --arg request_id "$REQUEST_ID" --arg command "$COMMAND"               '{ref:$ref,inputs:{request_id:$request_id,command:$command}}')"
            WORKFLOW="hh520-predict.yml"

          elif [[ "$TYPE" == "research" ]]; then
            START_DATE="$(jq -r '.start_date // empty' "$REQUEST_FILE")"
            END_DATE="$(jq -r '.end_date // empty' "$REQUEST_FILE")"
            [[ "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid start_date"; exit 2; }
            [[ "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid end_date"; exit 2; }
            PAYLOAD="$(jq -nc --arg ref main --arg request_id "$REQUEST_ID" --arg start_date "$START_DATE" --arg end_date "$END_DATE"               '{ref:$ref,inputs:{request_id:$request_id,start_date:$start_date,end_date:$end_date}}')"
            WORKFLOW="hh520-research.yml"

          else
            echo "unsupported request type: $TYPE"
            exit 2
          fi

          curl --fail-with-body -sS -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/dispatches"             -d "$PAYLOAD"

          echo "Dispatched $WORKFLOW for $REQUEST_ID"
